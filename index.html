<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pain Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #f7f3ec; --card: #fffdf9; --ink: #26303a; --muted: #6a7480; --line: #e3dccf;
    --accent: #2b7a82; --accent-ink: #ffffff; --soft: #e5f1f1; --hot: #e0565b; --ok: #2b7a82; --warn: #a9480a;
    --shadow: 0 1px 2px rgba(38,48,58,.06), 0 8px 24px rgba(38,48,58,.07);
    --skin: #f2c9a5; --skin-line: #b98a63; --hair: #6b4a33;
  }
  :root[data-theme="dark"] {
    --bg: #14181d; --card: #1d232a; --ink: #e9edf0; --muted: #98a3ad; --line: #323b45;
    --accent: #5db5bc; --accent-ink: #0f1a1c; --soft: #20363a; --hot: #ef6c70; --ok: #5db5bc; --warn: #f0a468;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.45 "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 14px 16px 0; min-height: 100vh; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: .2px; }
  .brand svg { width: 28px; height: 28px; }
  .mode { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .progress { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; color: var(--muted); font-size: 14px; font-weight: 600; }
  .bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; border-radius: 99px; transition: width .3s ease; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 20px 18px; box-shadow: var(--shadow); animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } * { transition: none !important; } }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; font-weight: 800; letter-spacing: -.2px; }
  p.hint { color: var(--muted); font-size: 15px; margin: 0 0 14px; }
  .note { color: var(--warn); font-weight: 700; margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--soft); }
  .faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .face { border: 2px solid transparent; background: transparent; border-radius: 16px; padding: 8px 2px 6px; cursor: pointer; color: var(--ink); font: inherit; text-align: center; transition: transform .12s, background .12s; }
  .face svg { width: 100%; max-width: 64px; height: auto; display: block; margin: 0 auto 2px; }
  .face .n { font-weight: 800; font-size: 20px; }
  .face .w { font-size: 12px; color: var(--muted); min-height: 30px; line-height: 1.15; }
  .face:active { transform: scale(.94); }
  .face[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); transform: scale(1.04); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  button { -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.pill { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 16px; padding: 12px 16px; min-height: 54px; font: inherit; font-weight: 600; cursor: pointer; text-align: center; transition: transform .1s, background .12s, border-color .12s; }
  button.pill:active, button.chip:active { transform: scale(.97); }
  button.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.pill[aria-pressed="true"]::before, button.chip[aria-pressed="true"]::before { content: "\2713\00a0"; font-weight: 800; }
  button.chip { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 15px; min-height: 46px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform .1s, background .12s; }
  button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .q { font-weight: 800; margin: 20px 0 0; }
  .q:first-of-type { margin-top: 0; }
  .heads { display: flex; gap: 6px; justify-content: center; }
  .heads svg { width: 100%; max-width: 330px; height: auto; touch-action: manipulation; }
  .zone { fill: rgba(43,122,130,.08); stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 4; cursor: pointer; transition: fill .12s; }
  .zone:hover { fill: rgba(43,122,130,.22); }
  .zone.on { fill: var(--hot); fill-opacity: .72; stroke: var(--hot); stroke-dasharray: none; stroke-width: 2.4; }
  .skin { fill: var(--skin); stroke: var(--skin-line); stroke-width: 3; }
  .hair { fill: var(--hair); }
  .vlabel { font-size: 15px; font-weight: 700; fill: var(--muted); text-anchor: middle; }
  .picked { margin: 12px 0 0; min-height: 26px; font-weight: 700; color: var(--accent); }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .stepper:last-of-type { border-bottom: 0; }
  .stepper .lbl { flex: 1; font-weight: 600; line-height: 1.25; }
  .stepper .val { min-width: 96px; text-align: center; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stepper button { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--accent); background: var(--card); color: var(--accent); font: inherit; font-size: 30px; font-weight: 600; line-height: 1; cursor: pointer; transition: transform .1s, background .12s; }
  .stepper button:active { transform: scale(.92); background: var(--soft); }
  textarea, input[type=text], input[type=date], input[type=time] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 10px; }
  textarea:focus, input[type=text]:focus, input[type=date]:focus, input[type=time]:focus { outline: none; border-color: var(--accent); }
  .nav { position: sticky; bottom: 0; display: flex; gap: 10px; margin-top: auto; padding: 14px 0 calc(14px + env(safe-area-inset-bottom)); background: var(--bg); }
  .nav button { flex: 1; border: 0; border-radius: 18px; padding: 17px; font: inherit; font-weight: 800; font-size: 19px; cursor: pointer; transition: transform .1s, opacity .15s; }
  .nav button:active { transform: scale(.98); }
  .back { background: transparent; color: var(--muted); border: 2px solid var(--line) !important; flex: 0 0 32% !important; }
  .next { background: var(--ok); color: var(--accent-ink); }
  .next[disabled] { background: var(--line); color: var(--muted); cursor: default; }
  .rev { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .rev:last-of-type { border-bottom: 0; }
  .rev b { display: block; font-size: 14px; color: var(--muted); font-weight: 700; }
  .rev span { font-weight: 600; }
  .rev button { background: var(--soft); border: 0; color: var(--accent); font: inherit; font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .done { text-align: center; padding: 18px 0 10px; }
  .done svg { width: 84px; height: 84px; }
  .done .tick { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .6s .15s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .err { color: var(--hot); font-weight: 700; margin-top: 12px; }
  .foot { color: var(--muted); font-size: 12.5px; text-align: center; margin: 0 0 calc(10px + env(safe-area-inset-bottom)); }
</style>
</head>

      nx.disabled = !s.valid(); nx.onclick = function () { go(1); }; nav.appendChild(nx);
    }
  }

  function buildBody() {
    var p = new URLSearchParams();
    var nh = S.noPain;
    p.append(E.yesno, nh ? "No" : "Yes");
    if (!nh) {
      p.append(E.pain, String(S.pain));
      chosenSpots().forEach(function (x) { p.append(E.where, x); });
      keys(S.start).forEach(function (x) { p.append(E.start, x); });
    }
    p.append(E.howlong, nh ? "No headache today" : S.howLong);
    p.append(E.sound, nh ? "No" : S.sound);
    p.append(E.light, nh ? "No" : S.light);
    p.append(E.talk, nh ? "Yes, normally" : S.talk);
    p.append(E.nausea, S.nausea); p.append(E.threw, S.threw);
    p.append(E.medicine, S.medicine);
    if (S.otherMode === "yes") keys(S.others).forEach(function (x) { p.append(E.other, x); }); else p.append(E.other, "Nothing else hurts");
    var extra = ["Entry type: " + (isDay() ? "Whole day" : "Right now"), "Entry date: " + S.date];
    if (isCheck()) extra.push("Entry time: " + S.time);
    if (isDay()) {
      p.append(E.exercise, S.exercise); p.append(E.period, S.period);
      p.append(E.tv, tvRange(S.tv));
      if (S.tv > 0) keys(S.tvKinds).forEach(function (x) { p.append(E.tvkinds, x); }); else p.append(E.tvkinds, "No TV today");
      p.append(E.comp, compRange(compMinutes()));
      if (compMinutes() > 0) keys(S.compUses).forEach(function (x) { p.append(E.compuse, x); }); else p.append(E.compuse, "Did not use a computer");
      p.append(E.food, foodText() || "Nothing entered");
      p.append(E.water, bottles(S.water));
      extra.push("TV minutes: " + S.tv, "Computer or tablet at school (in class), minutes: " + S.school, "Computer or tablet for homework at home, minutes: " + S.homework, "Computer or tablet at home not school, minutes: " + S.comp, "Phone or other screens, minutes: " + S.phone, "Sleep last night: " + S.sleep + " hours", "Jaw or face sore on waking: " + S.jaw, "Zigzag lines or blurry spots: " + S.aura);
    }
    if (S.medicine === "Yes" && S.medNote) extra.push("Medicine: " + S.medNote);
    if (S.notSure) extra.push("Headache location: not sure");
    p.append(E.extra, extra.join("\n"));
    return p;
  }

  function submit() {
    if (saving) return;
    saving = true; errMsg = ""; render();
    fetch(FORM_URL, { method: "POST", mode: "no-cors", body: buildBody() }).then(function () {
      saving = false; saved = true; render(); window.scrollTo(0, 0);
    }).catch(function () {
      saving = false; errMsg = "Could not save. Check the internet and try again."; render();
    });
  }

  (function () {
    var root = document.documentElement, btn = document.getElementById("modeBtn");
    var saved = null; try { saved = localStorage.getItem("pp-theme"); } catch (e) {}
    var dark = saved ? saved === "dark" : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    function apply() { root.setAttribute("data-theme", dark ? "dark" : "light"); btn.textContent = dark ? "Light mode" : "Dark mode"; }
    btn.onclick = function () { dark = !dark; try { localStorage.setItem("pp-theme", dark ? "dark" : "light"); } catch (e) {} apply(); };
    apply();
  })();

  render();
</script>
</body>
</html>
